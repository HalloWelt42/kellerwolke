# Die Datenbank laeuft in Docker. Das benannte Volume wird ueber den
# eindeutigen COMPOSE_PROJECT_NAME je Klon isoliert (vermeidet das macOS-
# Bind-Mount-Risiko bei DB-Dateien). Das Backend laeuft daneben (uvicorn).
# Auf dem Pi steht zusaetzlich "web" vorne (Profil web): gebaute Oberflaeche,
# Weiterleitung von /api und /webdav, TLS aus der Hausstelle.
name: ${COMPOSE_PROJECT_NAME:-kellerwolke}

services:
  db:
    image: postgres:16-alpine
    # Nach einem Neustart (Pi laeuft 24/7) automatisch wieder hochkommen; nur
    # ein ausdrueckliches Stoppen haelt den Container unten.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KELLERWOLKE_DB_NAME:-kellerwolke}
      POSTGRES_USER: ${KELLERWOLKE_DB_USER:-kellerwolke}
      POSTGRES_PASSWORD: ${KELLERWOLKE_DB_PASS:-kellerwolke}
    ports:
      - "${KELLERWOLKE_DB_PORT:-5460}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KELLERWOLKE_DB_USER:-kellerwolke} -d ${KELLERWOLKE_DB_NAME:-kellerwolke}"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: caddy:2.11.6-alpine
    profiles: ["web"]
    restart: unless-stopped
    # Im Netz des Rechners: Backend und Ports liegen dort, kein eigenes Docker-Netz noetig.
    network_mode: host
    security_opt: ["no-new-privileges:true"]
    environment:
      KELLERWOLKE_HAUPTADRESSE: ${KELLERWOLKE_HAUPTADRESSE:-192.168.178.49}
      KELLERWOLKE_BACKEND_PORT: ${KELLERWOLKE_BACKEND_PORT:-8460}
      KELLERWOLKE_FRONTEND_PORT: ${KELLERWOLKE_FRONTEND_PORT:-5200}
      KELLERWOLKE_TLS_PORT: ${KELLERWOLKE_TLS_PORT:-5201}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/oberflaeche:ro
      - type: bind
        source: ${KELLERWOLKE_ZERTIFIKATE:-./data/zertifikate}
        target: /zertifikate
        read_only: true
        bind: { create_host_path: false }
    deploy: { resources: { limits: { memory: 128M } } }

volumes:
  pgdata:
